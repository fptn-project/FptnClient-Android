name: Build FptnClient Android (FOSS)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/md3-compose-ui

jobs:
  build_foss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python & Conan
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan and build tools
        run: |
          pip install --upgrade pip conan numpy cmake ninja
          conan profile detect --force || true

      - name: Install Android NDK
        run: |
          echo "Installing NDK 28.1.13356709"
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.1.13356709"

      - name: Cache Gradle and Conan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.conan2
          key: ${{ runner.os }}-foss-${{ hashFiles('**/*.gradle*', '**/conanfile.*', 'gradle/libs.versions.toml', 'conan/**') }}
          restore-keys: |
            ${{ runner.os }}-foss-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Upload FOSS Debug APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: fptn-foss-debug-${{ github.sha }}
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
